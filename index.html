<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Софушка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial Black', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg,
        #f97316 0%,
        #ec4899 30%,
        #a855f7 60%,
        #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      width: 600px;
      height: 400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: 6vw;
      color: white;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      z-index: 1;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.15);
      white-space: nowrap;
      padding-left: 3vw;
    }

    h1 .cursor {
      display: inline-block;
      width: 0.08em;
      background: white;
      margin-left: 0.05em;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    img {
      position: absolute;
      right: 20vw;
      bottom: 35vh;
      height: 48vh;
      image-rendering: pixelated;
      z-index: 2;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    img.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Контейнер с кнопками внизу */
    .buttons {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      display: flex;
      gap: 16px;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .buttons.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .about-btn {
      padding: 14px 36px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 1.2rem;
      color: white;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .about-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      position: relative;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      color: #2c3e50;
      transform: scale(0.9);
      transition: transform 0.4s ease;
      backdrop-filter: blur(20px);
    }

    .modal-overlay.open .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .modal p {
      font-family: Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .modal p:last-child {
      margin-bottom: 0;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;color: #2c3e50;
      line-height: 1;
      transition: transform 0.2s;
    }

    .modal-close:hover {
      transform: scale(1.2);
    }

    /* Стили для квиза */
    .quiz-question {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .quiz-answer {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 10px;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      text-align: left;
      color: #2c3e50;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid rgba(44, 62, 80, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, border 0.2s, transform 0.2s;
    }

    .quiz-answer:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(44, 62, 80, 0.4);
      transform: translateX(4px);
    }

    .quiz-answer.selected {
      background: rgba(168, 85, 247, 0.25);
      border-color: #a855f7;
    }

    .quiz-progress {
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-bottom: 10px;
    }

    .quiz-start-btn {
      padding: 16px 40px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 1.1rem;
      color: white;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }

    .quiz-start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(168, 85, 247, 0.5);
    }

    .quiz-result {
      text-align: center;
      font-size: 1.4rem;
      line-height: 1.5;
      color: #2c3e50;
    }

    .quiz-result .percent {
      font-size: 3rem;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin: 12px 0;
    }

    /* Мобильная версия */
    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      h1 {
        font-size: 14vw;
        padding-left: 0;
        margin-top: -10vh;
      }

      img {
        position: absolute;
        right: 50%;
        bottom: 35vh;
        height: 40vh;
        transform: translateX(50%) translateY(30px);
      }

      img.show {
        transform: translateX(50%) translateY(0);
      }

      body::before {
        width: 300px;
        height: 250px;
      }

      .buttons {
        gap: 10px;
        bottom: 4vh;
      }

      .about-btn {
        font-size: 0.9rem;
        padding: 10px 20px;
      }

      .modal {
        padding: 30px 22px;
      }

      .modal h2 {
        font-size: 1.3rem;
      }

      .modal p {
        font-size: 0.95rem;
      }

      .quiz-question {
        font-size: 1.1rem;
      }

      .quiz-answer {
        font-size: 0.9rem;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <h1><span id="text"></span><span class="cursor">&nbsp;</span></h1>
  <img id="girl" src="girl.png" alt="Пиксельная девочка">

  <div class="buttons" id="buttons">
    <button class="about-btn" id="aboutBtn">Обо мне</button>
    <button class="about-btn" id="quizBtn">Угадайка</button>
  </div>

  <!-- Окно "Обо мне" -->
  <div class="modal-overlay" id="aboutOverlay">
    <div class="modal">
      <button class="modal-close" id="aboutClose">×</button>
      <h2>Обо мне</h2>
      <p>Я очень люблю котиков 🐱</p>
      <p>Моя любимая группа — Deftones 🎵</p>
    </div>
  </div>

  <!-- Окно "Угадайка" -->
  <div class="modal-overlay" id="quizOverlay">
    <div class="modal">
      <button class="modal-close" id="quizClose">×</button>
      <div id="quizContent"></div>
    </div>
  </div>

  <script>
    const fullText = "ПРИВЕТ!!!";
    const textEl = document.getElementById("text");
    const girlEl = document.getElementById("girl");const buttonsEl = document.getElementById("buttons");

    const aboutBtn = document.getElementById("aboutBtn");
    const aboutOverlay = document.getElementById("aboutOverlay");
    const aboutClose = document.getElementById("aboutClose");

    const quizBtn = document.getElementById("quizBtn");
    const quizOverlay = document.getElementById("quizOverlay");
    const quizClose = document.getElementById("quizClose");
    const quizContent = document.getElementById("quizContent");

    /* ============ АНИМАЦИЯ ПЕЧАТИ ============ */
    let i = 0;
    function type() {
      if (i < fullText.length) {
        textEl.textContent += fullText.charAt(i);
        i++;
        setTimeout(type, 180);
      } else {
        document.querySelector(".cursor").style.display = "none";

        setTimeout(() => {
          girlEl.classList.add("show");
        }, 400);

        setTimeout(() => {
          buttonsEl.classList.add("show");
        }, 1800);
      }
    }
    setTimeout(type, 500);

    /* ============ ОКНО "ОБО МНЕ" ============ */
    aboutBtn.addEventListener("click", () => aboutOverlay.classList.add("open"));
    aboutClose.addEventListener("click", () => aboutOverlay.classList.remove("open"));
    aboutOverlay.addEventListener("click", (e) => {
      if (e.target === aboutOverlay) aboutOverlay.classList.remove("open");
    });

    /* ============ ОКНО "УГАДАЙКА" ============ */
    quizBtn.addEventListener("click", () => {
      quizOverlay.classList.add("open");
      showQuizIntro();
    });
    quizClose.addEventListener("click", () => quizOverlay.classList.remove("open"));
    quizOverlay.addEventListener("click", (e) => {
      if (e.target === quizOverlay) quizOverlay.classList.remove("open");
    });

    // Вопросы и правильные ответы
    const questions = [
      {
        q: "В каком месяце я родилась?",
        answers: ["Февраль", "Май", "Декабрь", "Август"],
        correct: 0
      },
      {
        q: "Мой любимый цвет?",
        answers: ["Коричневый", "Розовый", "Голубой", "Зелёный"],
        correct: 1
      },
      {
        q: "Моя любимая игра?",
        answers: ["Dota 2", "Sally Face", "Clash Royale", "Warcraft III"],
        correct: 3
      },
      {
        q: "Мой рекорд сна?",
        answers: ["10+ часов", "12+ часов", "18+ часов", "20+ часов"],
        correct: 2
      },
      {
        q: "Мой любимый напиток?",
        answers: ["Пиво", "Молочный коктейль", "Капучино", "Кола зеро"],
        correct: 1
      },
      {
        q: "Мой любимый аниме персонаж?",
        answers: ["Годжо Сатору", "Эл Лоулайт", "Гриффит", "Харука Касугано"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function showQuizIntro() {
      quizContent.innerHTML = `
        <h2>На сколько процентов ты меня знаешь?</h2>
        <p style="font-family: Arial, sans-serif; margin-bottom: 20px;">Ответь на 6 вопросов — и узнаем!</p>
        <button class="quiz-start-btn" id="startQuizBtn">Погнали!</button>
      `;
      document.getElementById("startQuizBtn").addEventListener("click", () => {
        currentQuestion = 0;
        score = 0;
        showQuestion();
      });
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      const progress = `Вопрос ${currentQuestion + 1} из ${questions.length}`;

      quizContent.innerHTML = `
        <div class="quiz-progress">${progress}</div>
        <div class="quiz-question">${q.q}</div>
        ${q.answers.map((a, idx) =>
          `<button class="quiz-answer" data-idx="${idx}">${a}</button>`
        ).join("")}
      `;

      document.querySelectorAll(".quiz-answer").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.idx);
          if (idx === q.correct) score++;

          currentQuestion++;
          if (currentQuestion < questions.length) {
            showQuestion();
          } else {
            showResult();
          }
        });});
    }

    function showResult() {
      const percent = Math.round((score / questions.length) * 100);

      quizContent.innerHTML = `
        <div class="quiz-result">
          <p>Ты знаешь меня на</p>
          <span class="percent">${percent}%</span>
          <p>🎉</p>
        </div>
      `;
    }

    /* ============ ЗАКРЫТИЕ ПО ESC ============ */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        aboutOverlay.classList.remove("open");
        quizOverlay.classList.remove("open");
      }
    });
  </script>
</body>
</html>
