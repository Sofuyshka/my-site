<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Софушка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial Black', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg,
        #f97316 0%,
        #ec4899 30%,
        #a855f7 60%,
        #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      width: 600px;
      height: 400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: 6vw;
      color: white;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      z-index: 1;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.15);
      white-space: nowrap;
      padding-left: 3vw;
    }

    /* Курсор, который мигает во время печати */
    h1 .cursor {
      display: inline-block;
      width: 0.08em;
      background: white;
      margin-left: 0.05em;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Девочка — изначально невидима */
    img {
      position: absolute;
      right: 20vw;
      bottom: 35vh;
      height: 48vh;
      image-rendering: pixelated;
      z-index: 2;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s ease;
    }

    img.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Мобильная версия */
    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      h1 {
        font-size: 14vw;
        padding-left: 0;
        margin-top: -10vh;
      }

      img {
        position: absolute;
        right: 50%;
        bottom: 35vh;
        height: 40vh;
        transform: translateX(50%) translateY(30px);
      }

      img.show {
        transform: translateX(50%) translateY(0);
      }

      body::before {
        width: 300px;
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <h1><span id="text"></span><span class="cursor">&nbsp;</span></h1>
  <img id="girl" src="girl.png" alt="Пиксельная девочка">

  <script>
    const fullText = "ПРИВЕТ!!!";
    const textEl = document.getElementById("text");
    const girlEl = document.getElementById("girl");
    let i = 0;

    function type() {
      if (i < fullText.length) {
        textEl.textContent += fullText.charAt(i);
        i++;
        setTimeout(type, 180);
      } else {
        // Прячем курсор после печати
        document.querySelector(".cursor").style.display = "none";

        // Показываем девочку
        setTimeout(() => {
          girlEl.classList.add("show");
        }, 400);
      }
    }

    setTimeout(type, 500);
  </script>
</body>
</html>
